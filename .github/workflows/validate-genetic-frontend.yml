name: Validate genetic frontend

on:
  push:
    branches:
      - tei-genetic-model-prototype
    paths:
      - 'assets/genetic/**'
      - 'css/genetic-edition.css'
      - 'edition/index.md'
      - '_layouts/edition.html'
      - 'Gemfile'
      - 'vercel.json'
      - '_config.vercel.yml'
      - '.github/workflows/validate-genetic-frontend.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build Jekyll site
        run: |
          bundle install
          bundle exec jekyll build --config _config.yml,_config.vercel.yml --destination _site-test
          test -f _site-test/genetic/index.html

      - name: Check JavaScript syntax
        run: |
          node --check assets/genetic/model.js
          node --check assets/genetic/facsimile.js
          node --check assets/genetic/app.js

      - name: Check facsimile folio mapping
        run: |
          python - <<'PY'
