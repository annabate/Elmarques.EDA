name: Validate genetic frontend

on:
  push:
    branches:
      - tei-genetic-model-prototype
    paths:
      - 'assets/genetic/**'
      - 'css/genetic-edition.css'
      - 'edition/index.md'
      - '_layouts/edition.html'
      - '.github/workflows/validate-genetic-frontend.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          node --check assets/genetic/model.js
          node --check assets/genetic/facsimile.js
          node --check assets/genetic/app.js

      - name: Check genetic page uses the new TEI model
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('edition/index.md').read_text(encoding='utf-8')
          scripts = '\n'.join(
              Path(path).read_text(encoding='utf-8')
              for path in [
                  'assets/genetic/model.js',
                  'assets/genetic/facsimile.js',
                  'assets/genetic/app.js',
              ]
          )

          required = [
              'EMN_mod_act1_pilot.xml',
              'reconstruction-select',
              'intervention-layer',
              'assets/genetic/model.js',
              'assets/genetic/facsimile.js',
              'assets/genetic/app.js',
          ]
          missing = [item for item in required if item not in index]
          if missing:
              raise SystemExit(f'Missing frontend requirements: {missing}')

          legacy = {
              'edition/index.md': ['EMN_mod.xml', 'varSeq', 'tei-rdg', 'tei-lem'],
              'genetic JS modules': ['varSeq', 'tei-rdg', 'tei-lem'],
          }
          for token in legacy['edition/index.md']:
              if token in index:
                  raise SystemExit(f'Legacy dependency in edition/index.md: {token}')
          for token in legacy['genetic JS modules']:
              if token in scripts:
                  raise SystemExit(f'Legacy dependency in genetic JS modules: {token}')

          print('Genetic frontend points to the validated act-I model and contains no legacy apparatus dependencies.')
          PY
