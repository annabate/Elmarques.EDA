          from pathlib import Path

          def canonical(label):
              value = label.lower()
              value = value.replace('[', '').replace(']', '')
              value = re.sub(r'^fol\.?\s*', '', value)
              value = re.sub(r'\s+', '', value)
              value = re.sub(r'\.+', '.', value)
              value = re.sub(r'^n\.n\.([rv])\.?          python - <<'PY'
