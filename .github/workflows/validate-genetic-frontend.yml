name: Validate genetic frontend

on:
  push:
    branches:
      - tei-genetic-model-prototype
    paths:
      - 'assets/genetic/**'
      - 'css/genetic-edition.css'
      - 'edition/index.md'
      - 'edition/prototype/EMN_mod_act1_pilot.xml'
      - 'edition/EMN_dip.xml'
      - '_layouts/edition.html'
      - 'Gemfile'
      - 'vercel.json'
      - '_config.vercel.yml'
      - '.github/workflows/validate-genetic-frontend.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build Jekyll site
        run: |
          bundle install
          bundle exec jekyll build --config _config.yml,_config.vercel.yml --destination _site-test
          test -f _site-test/genetic/index.html

      - name: Check JavaScript syntax
        run: |
          node --check assets/genetic/model.js
          node --check assets/genetic/facsimile.js
          node --check assets/genetic/app.js

      - name: Check genetic verse numbering
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path('edition/prototype/EMN_mod_act1_pilot.xml')
          ET.parse(path)
          text = path.read_text(encoding='utf-8')

          lines = []
          for match in re.finditer(r'<l\b([^>]*)>', text):
              attrs = match.group(1)
              n_match = re.search(r'\bn="([^"]+)"', attrs)
              part_match = re.search(r'\bpart="([^"]+)"', attrs)
              lines.append({
                  'n': n_match.group(1) if n_match else None,
                  'part': part_match.group(1) if part_match else '',
              })

          if len(lines) != 908:
              raise SystemExit(f'Expected 908 genetic line elements, found {len(lines)}')

          missing = [i for i, line in enumerate(lines) if not line['n']]
          if missing:
              raise SystemExit(f'Genetic lines without @n: {missing[:20]}')

          current = 0
          for i, line in enumerate(lines):
              value = int(line['n'])
              if line['part'] in {'M', 'F'}:
                  expected = current
              else:
                  expected = current + 1

              if value != expected:
                  raise SystemExit(
                      f'Incoherent verse numbering at line index {i}: '
                      f'found {value}, expected {expected}, part={line["part"]!r}'
                  )
              current = value

          if current != 836:
              raise SystemExit(f'Expected final genetic verse 836, found {current}')

          verse_550 = [
              line['part'] for line in lines if line['n'] == '550'
          ]
          if verse_550 != ['I', 'F']:
              raise SystemExit(
                  f'Verse 550 must be split I/F, found {verse_550}'
              )

          print('Genetic pilot: 908 line elements fully numbered through verse 836.')
          PY

      - name: Check facsimile folio mapping
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def canonical(label):
              value = label.lower()
              value = value.replace('[', '').replace(']', '')
              value = re.sub(r'^fol\.?\s*', '', value)
              value = re.sub(r'\s+', '', value)
              value = re.sub(r'\.+', '.', value)
              value = re.sub(r'^n\.n\.([rv])\.?$', r'nn\1', value)
              value = re.sub(r'^guarda([rv])\.?$', r'guarda\1', value)
              value = re.sub(r'^(\d+)([rv])\.?$', r'\1\2', value)
              return value

          def image_name(label):
              key = canonical(label)
              if re.match(r'^\d+[rv]$', key):
                  return f'facs/fol{key}.jpg'
              special = {
                  'nnr': 'facs/foln.n.r..jpg',
                  'nnv': 'facs/foln.n.v..jpg',
                  'guardar': 'facs/folguarda.jpg',
                  'guardav': 'facs/folguardav..jpg',
              }
              return special.get(key, 'facs/placeholder.jpg')

          labels = []
          for path in [
              'edition/prototype/EMN_mod_act1_pilot.xml',
              'edition/EMN_dip.xml',
          ]:
              text = Path(path).read_text(encoding='utf-8')
              labels.extend(re.findall(r'<pb\b[^>]*\bn="([^"]+)"', text))

          keys = {}
          for label in labels:
              key = canonical(label)
              keys.setdefault(key, set()).add(label)

          missing = []
          for key, variants in keys.items():
              image = Path(image_name(next(iter(variants))))
              if not image.exists():
                  missing.append((key, sorted(variants), str(image)))

          if missing:
              raise SystemExit(f'Missing facsimile mappings: {missing}')

          if canonical('[Fol. 7V]') != canonical('[Fol. 7v]'):
              raise SystemExit('Folio normalization does not unify 7V/7v')

          print(f'{len(keys)} canonical folios mapped to existing facsimile images.')
          PY

      - name: Check genetic page uses the new TEI model
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('edition/index.md').read_text(encoding='utf-8')
          scripts = '\n'.join(
              Path(path).read_text(encoding='utf-8')
              for path in [
                  'assets/genetic/model.js',
                  'assets/genetic/facsimile.js',
                  'assets/genetic/app.js',
              ]
          )

          required = [
              'EMN_mod_act1_pilot.xml',
              'reconstruction-select',
              'intervention-layer',
              'toolbar-tools',
              'sync-views',
              'text-size-controls',
              'assets/genetic/model.js',
              'assets/genetic/facsimile.js',
              'assets/genetic/app.js',
          ]
          missing = [item for item in required if item not in index]
          if missing:
              raise SystemExit(f'Missing frontend requirements: {missing}')

          legacy = {
              'edition/index.md': ['EMN_mod.xml', 'varSeq', 'tei-rdg', 'tei-lem'],
              'genetic JS modules': ['varSeq', 'tei-rdg', 'tei-lem'],
          }
          for token in legacy['edition/index.md']:
              if token in index:
                  raise SystemExit(f'Legacy dependency in edition/index.md: {token}')
          for token in legacy['genetic JS modules']:
              if token in scripts:
                  raise SystemExit(f'Legacy dependency in genetic JS modules: {token}')

          print('Genetic frontend points to the validated act-I model and contains no legacy apparatus dependencies.')
          PY
